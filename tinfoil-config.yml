# Tinfoil container configuration — Aubrai harness (production: api.aubr.ai, UI chat.aubr.ai)
#
# Copy of record lives in the public config repo VitaDAO/aubrai-harness-prod-tinfoil-config, which is
# the attestation anchor: the image digest below is pinned by the deploy runbook, never by hand
# during a review. Secrets are referenced by organization-vault name only.

cvm-version: 0.14.10
cpus: 2
memory: 16384  # as aubrai-server-prod

networks:
  public:
    # Preserve existing database/API/paper retrieval access under CVM 0.14 isolation.
    egress: open

containers:
  - name: aubrai
    networks: [public]
    read_only: true
    # The non-root server and tsx need scratch space; application code stays read-only.
    tmpfs:
      /tmp: "rw,nosuid,nodev,size=4g,mode=1777"
    # Pinned by the runbook after `.github/workflows/tinfoil-deploy.yml` prints the digest.
    image: "ghcr.io/vitadao/aubrai-harness:tinfoil-v2026.09.25.5@sha256:5f90e9a39ad96c538aa82b621fba1076eb06ef786c73735c225c29f7d0bb5f00"
    # Tinfoil switches a blue-green update's traffic once the new version is healthy. Without this it
    # switched while the server was still migrating (/health 502 for ~13 s at the v2026.09.15.11 switch).
    # The image has no curl, so Node asks the server itself on the port the proxy forwards to.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 3s
      timeout: 2s
      retries: 3
      start_period: 300s
    env:
      # Non-sensitive configuration (apps/server/src/env.ts is the contract).
      - NODE_ENV: "production"
      - SENTRY_ENVIRONMENT: "production"
      - SENTRY_RELEASE: "7d933d29e323c0851b16e9d811fc57904fbea444"
      - HOST: "0.0.0.0"
      - PORT: "3000"
      - AUBRAI_STORAGE_ROOT: "/tmp/aubrai"
      - AUBRAI_KNOWLEDGE_INDEX: "/app/.data/knowledge/index.json"
      - AUBRAI_KNOWLEDGE_MANIFEST: "/app/docs/inventories/knowledge-nvidia-2026-09-08.json"
      # Structure-design pipelines need the extended profile to finish.
      - AUBRAI_RUN_BUDGET: "extended"
      # Conversations run at once across all accounts; more wait in the queue.
      - AUBRAI_WORKER_CONCURRENCY: "6"
      - AUBRAI_DEFAULT_CONCURRENT_RUNS: "2"
      - AUBRAI_DEFAULT_MONTHLY_RUNS: "100"
      # Wait for existing research before the candidate becomes ready.
      - AUBRAI_DEPLOYMENT_DRAIN: "true"
      # A release stops the old container: runs under way get this long to finish before it exits.
      - AUBRAI_SHUTDOWN_GRACE_MS: "25000"
      # Production's database is shared with the previous app; the harness lives in its own schema.
      - DATABASE_SCHEMA: "harness"
      - ALLOWED_ORIGINS: "https://chat.aubr.ai"
      # Public Privy application id (also embedded in every browser bundle).
      - PRIVY_APP_ID: "cmb5myawn00wkjm0m1o77894v"
      - NVIDIA_MAX_COST_MICROUSD_PER_REQUEST: "250000"
      - ANALYSIS_MAX_COST_MICROUSD: "500000"
      # Literature discovery matches production: Firecrawl research index, read back through PubMed.
      - LITERATURE_RETRIEVAL_PROVIDER: "firecrawl"
      - PAPER_CORPUS_URL: "https://papercorpus-production.up.railway.app"
      - PAPER_CORPUS_TIMEOUT_MS: "5000"
      # The previous app's literature pipeline (packages/legacy-literature) with production's own settings.
      - FAST_CHAT_LLM_PROVIDER: "cerebras"
      - FIRECRAWL_WEB_TIMEOUT_MS: "20000"
      - LITERATURE_BALANCED_FIRECRAWL_TIMEOUT_MS: "20000"
      - LITERATURE_BALANCED_FIRECRAWL_NUM_RESULTS: "12"
      - LITERATURE_BALANCED_FIRECRAWL_CONTENTS_TIMEOUT_MS: "12000"
      - LITERATURE_BALANCED_FIRECRAWL_OVERVIEW_CONTENTS_MAX_URLS: "1"
      - LITERATURE_DEEP_FIRECRAWL_TIMEOUT_MS: "30000"
      - LITERATURE_DEEP_FIRECRAWL_CONTENTS_TIMEOUT_MS: "12000"
      - LITERATURE_DEEP_FIRECRAWL_CONTENTS_MAX_URLS: "5"
      - LITERATURE_DEEP_FIRECRAWL_MAX_SEARCHES: "3"
      - LITERATURE_DEEP_FIRECRAWL_WINDOW: "60"
      # The high-recall search runs up to 3 Firecrawl searches; at 2 at a time the third waited for a slot.
      - FIRECRAWL_SEARCH_CONCURRENCY: "3"
      - FIRECRAWL_CONTENTS_CONCURRENCY: "2"
      - FIRECRAWL_CONTENTS_TOTAL_TIMEOUT_MS: "12000"
      - FIRECRAWL_CONTENTS_MAX_URLS: "8"
      - FIRECRAWL_EUROPE_PMC_FULLTEXT_FALLBACK: "true"
      - FIRECRAWL_EUROPE_PMC_FULLTEXT_MAX_URLS: "4"
      - LITERATURE_FIRECRAWL_RERANKER: "deterministic"
      - FIRECRAWL_RETRY_DELAY_MS: "750"
      - FAST_CHAT_LLM_MODEL: "gemma-4-31b"
      - FAST_CHAT_HYDE_PROVIDER: "cerebras"
      - FAST_CHAT_HYDE_MODEL: "gemma-4-31b"
      - FAST_CHAT_QUERY_REFORMULATE_PROVIDER: "cerebras"
      - FAST_CHAT_QUERY_REFORMULATE_MODEL: "gemma-4-31b"
      - FAST_CHAT_RERANK_PROVIDER: "cerebras"
      - FAST_CHAT_RERANK_MODEL: "gemma-4-31b"
      - LITERATURE_HYDE_ENABLED: "true"
      # Two search steps waited out their full limits on every query (measured 2026-09-14: Europe PMC recovery
      # 4.0 s, page prequalification 5.0 s, of an ~11 s search). Capped, the search takes 2-5 s and LitQA3
      # rows 0-19 hit@15 stays at or above the uncapped settings (0.70 uncapped in the same session).
      - LITERATURE_DEEP_FIRECRAWL_EUROPE_PMC_TIMEOUT_MS: "1500"
      - FAST_CHAT_FIRECRAWL_PREQUALIFICATION_TIMEOUT_MS: "2000"
      # Private Fast literature sends questions to Firecrawl and TypeSafe, and abstracts to TypeSafe;
      # answers stay sealed. Deep literature keeps its existing enrichment path.
      - AUBRAI_PRIVATE_LITERATURE: "true"
      # Normal literature jobs use Cerebras. Private literature answers stay on the verified
      # Tinfoil route. Literature searches and paper reads still use external services.
      - AUBRAI_LITERATURE_PROVIDER: "cerebras"
      - AUBRAI_PRIVATE_LITERATURE_PROVIDER: "tinfoil"
      - CEREBRAS_MODEL: "qwen-3.8-27b"
      - CEREBRAS_REASONING_EFFORT: "none"
      # Private chat uses DeepSeek V4.1 Flash through verified hosted Tinfoil.
      - AUBRAI_PRIVATE_CHAT_PROVIDER: "tinfoil"
      - TINFOIL_MODEL: "deepseek-v4-1-flash"
      # V4.1 Flash thinks at high effort by default; low answers sooner (trial on staging).
      - DEEPSEEK_REASONING_EFFORT: "low"
    secrets:
      - AUBRAI_SENTRY_DSN
      # Registry pull credential
      - GHCR_TOKEN
      # PostgreSQL over TLS: administrative (startup migrations, roles, account store) and two least-privilege roles
      - DATABASE_ADMIN_URL
      - DATABASE_LOOKUP_URL
      - DATABASE_WORKER_URL
      # Private mode. Owner's decision: this deployment shares the previous Aubrai server's
      # enclave identity and key-wrap secret so it can read that server's encrypted history.
      # The consequence is deliberate: a compromise here reaches that data too.
      - HPKE_PRIVATE_KEY
      - HPKE_PUBLIC_KEY
      - ENCRYPTION_MASTER_KEY
      # The previous server's Supabase project, for its read-only history (plain and private)
      - AUBRAI_SUPABASE_URL
      - AUBRAI_SUPABASE_SERVICE_KEY
      # Inference and research tools
      - DEEPSEEK_API_KEY
      - TINFOIL_API_KEY
      - NVIDIA_API_KEY
      - FIRECRAWL_API_KEY
      - PAPER_CORPUS_API_KEY
      - TYPESAFE_API_KEY
      # The previous app's literature helper model (query recovery, HyDE), as in its production.
      - CEREBRAS_API_KEY
      # Table analysis (analyze_table): the same remote service production uses
      - DATA_ANALYSIS_API_URL
      - DATA_ANALYSIS_API_KEY

shim:
  upstream-port: 3000
  # Tinfoil's proxy answers CORS itself and strips the app's own header, so the app's
  # ALLOWED_ORIGINS alone is not enforced. Listing origins here makes the proxy refuse
  # any other browser origin (403); requests without an Origin header are unaffected.
  origins:
    - https://chat.aubr.ai
  paths:
    - /health
    - /auth/*
    - /v1/*
    # The previous Aubrai API's routes (apps/api/src/legacy-*.ts), including the Genome/x402 form routes.
    - /api/*
    - /agents/*
    - /deep-research/*
